<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPONAY — Холодный звонок</title><style>:root{--bg:#f5f2ea;--surface:#fff;--ink:#1c201e;--muted:#656c67;--green:#1f6f63;--green2:#e4efec;--line:#e2ddcf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,Manrope,Arial,sans-serif}.top{min-height:72px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:10px 22px;position:sticky;top:0;z-index:30}.logo{font-weight:900;font-size:19px;letter-spacing:-.04em}.nav{display:flex;gap:3px;overflow:auto;white-space:nowrap;margin-left:auto}.nav a{color:#53605b;text-decoration:none;padding:9px 11px;border-radius:9px;font-size:12px;font-weight:800}.nav a.active,.nav a:hover{background:var(--green2);color:var(--green)}.page{height:calc(100vh - 72px);padding:12px;position:relative}.frame{width:100%;height:100%;border:1px solid var(--line);background:#fff;border-radius:18px;box-shadow:0 12px 35px rgba(28,32,30,.06)}.tip{position:fixed;right:24px;top:84px;background:var(--green);color:#fff;padding:8px 11px;border-radius:8px;font-size:11px;z-index:40;box-shadow:0 8px 20px rgba(31,111,99,.18)}@media(max-width:760px){.top{min-height:64px;flex-wrap:wrap;padding:9px 14px;gap:8px}.nav{width:100%;margin:0}.page{height:auto;min-height:calc(100vh - 108px);padding:8px}.frame{height:calc(100vh - 122px);min-height:720px;border-radius:14px}.tip{display:none}}

or:var(--op-green)!important}button{font-family:inherit!important}#dialogContainer h1,#dialogContainer h2,#dialogContainer h3{color:var(--op-ink)!important}a{color:var(--op-green)!important}@media(max-width:760px){body{display:block!important;overflow:auto!important;padding:8px!important}.side-window,#dialogContainer{height:auto!important;margin-bottom:10px!important}.side-window{min-height:360px!important}}`;d.head.appendChild(s)}catch(e){console.warn(e)}});</script></body></html>
