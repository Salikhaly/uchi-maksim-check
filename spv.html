<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPONAY — СПВ</title><link rel="stylesheet" href="oponay-blue.css"><link rel="stylesheet" href="p0-ui.css"><link rel="stylesheet" href="p1-ui.css"><link rel="stylesheet" href="oponay-qa.css"></head><body><header style="position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #E5EAF1;padding:12px 20px;display:flex;align-items:center;gap:20px"><b style="color:#1F3A6E">OPONAY · СПВ</b><nav style="display:flex;gap:6px;overflow:auto;margin-left:auto"><a href="index.html">Главная</a><a href="call.html">Звонок</a><a href="spin.html">СПИН</a><a href="meeting.html">Встреча</a><a href="objections.html">Возражения</a></nav></header><main style="max-width:1180px;margin:auto;padding:24px 20px 70px"><div id="p0-app" data-p0-page="spv"></div><section style="margin-top:20px;background:#F5F7FA;border:1px solid #E5EAF1;border-radius:16px;padding:20px"><h2 style="color:#1F3A6E;margin-top:0">Исходный справочник СПВ</h2><p style="color:#5A6472">Ниже можно открыть полный исходный материал без потери формулировок.</p><a href="spv-source.html" style="display:inline-block;background:#1F3A6E;color:#fff;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:800">Открыть SPV Source</a></section></main><script src="p0-data.js"></script><script src="p0-app.js"></script>
<script>
(function(){
  document.documentElement.classList.add('oponay-runtime');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) document.documentElement.classList.add('oponay-reduced-motion');

  // Current-page marker for any shared step navigation.
  const here = location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('a[href]').forEach(a=>{
    const raw=(a.getAttribute('href')||'').split('#')[0];
    if(raw && raw===here) a.classList.add('oponay-current');
  });

  // Close native details cards when another card in the same group opens.
  document.querySelectorAll('[data-single-open]').forEach(group=>{
    group.addEventListener('toggle', e=>{
      if(!group.open) return;
      document.querySelectorAll('[data-single-open]').forEach(x=>{
        if(x!==group) x.removeAttribute('open');
      });
    });
  });

  // Escape closes open details and returns focus to the trigger.
  document.addEventListener('keydown', e=>{
    if(e.key!=='Escape') return;
    const open=[...document.querySelectorAll('details[open]')];
    if(open.length){ open.forEach(d=>d.removeAttribute('open')); }
  });

  // External hash navigation should land below sticky header.
  if(location.hash){
    requestAnimationFrame(()=>{
      const el=document.querySelector(location.hash);
      if(el) el.scrollIntoView({block:'start'});
    });
  }
})();
</script>
</body></html>
